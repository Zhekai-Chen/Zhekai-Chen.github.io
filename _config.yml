# Site settings
title                    : "Zhekai Chen"
description              : "Generative Models · Unified Multimodal Models · Agents"
url                      : "https://zhekai-chen.github.io"
baseurl                  : ""
repository               : "Zhekai-Chen/Zhekai-Chen.github.io"
google_scholar_stats_use_cdn : true

# Analytics and site verification (optional)
google_analytics_id      :
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site author
author:
  name             : "Zhekai Chen"
  avatar           : "images/bio-portrait-art.webp"
  bio              : "Ph.D. Student @ HKU MMLab"
  location         : "Hangzhou · Hong Kong · Shenzhen"
  employer         : "The University of Hong Kong"
  email            : "zkchen66@outlook.com"
  googlescholar    : "https://scholar.google.com/citations?user=_eZWcIMAAAAJ&hl=en"
  github           : "Zhekai-Chen"
  twitter          : "ChenZhekai3003"
  cv               : "/resume/Zhekai_Chen_CV.pdf"
  uri              :
  researchgate     :
  dblp             :
  orcid            :

# Reading files
include:
  - .htaccess
  - _pages
  - resume
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Asia/Hong_Kong

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
