name: Update Google Scholar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site tools
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout statistics branch
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: stats
      - name: Refresh public Scholar metrics
        run: python3 site/scripts/update_scholar.py stats
      - name: Publish changes
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_history.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "No citation changes."
          else
            git commit -m "Update Google Scholar statistics"
            git push origin google-scholar-stats
          fi
